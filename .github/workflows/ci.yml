name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prompts_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/prompts_vault
      REDIS_URL: redis://127.0.0.1:6379/0
      BILLING_MOCK_MODE: "false"
      PHASE11_VALIDATION_MODE: real
      PHASE11_REQUIRE_STRIPE_WEBHOOK: "true"
      STRIPE_SECRET_KEY: sk_test_ci_dummy
      STRIPE_WEBHOOK_SECRET: whsec_ci_dummy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q app
      - name: Docker Safety Gate
        run: python scripts/docker_safety_check.py --mode static
      - name: Migration Gate (PostgreSQL)
        run: alembic upgrade head
      - name: Pytest
        env:
          DEBUG: "true"
          JWT_SECRET_KEY: ci-pytest-jwt-secret-key-min-32-chars!!
          BILLING_MOCK_MODE: "true"
          REDIS_URL: ""
          CORS_ORIGINS: http://localhost:3000
        run: pytest -q
      - name: Phase 11 Gate (Real Infra)
        run: python scripts/phase11_validation.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prompts_vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/prompts_vault
      REDIS_URL: redis://127.0.0.1:6379/0
      JWT_SECRET_KEY: e2e-ci-jwt-secret-key-min-32-chars!!
      DEBUG: "true"
      BILLING_MOCK_MODE: "true"
      AUTH_COOKIE_ALLOW_INSECURE: "true"
      CORS_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install API
        working-directory: backend
        run: pip install -e ".[dev]"
      - name: Migrate
        working-directory: backend
        run: alembic upgrade head
      - name: Install web
        working-directory: frontend
        run: npm install
      - name: Build web
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: npm run build
      - name: Start API
        working-directory: backend
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/health
      - name: Start Next.js
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          npm run start -- --hostname 127.0.0.1 --port 3000 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:3000 && break; sleep 1; done
          curl -sf http://127.0.0.1:3000
      - name: Playwright
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run test:e2e:install
          npm run test:e2e
