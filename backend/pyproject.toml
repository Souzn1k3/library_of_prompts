[project]
name = "prompts-vault-api"
version = "0.1.0"
description = "Prompts Vault backend API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30.0",
  "psycopg2-binary>=2.9.10",
  "alembic>=1.14.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "structlog>=24.4.0",
  "python-jose[cryptography]>=3.3.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<4.1",
  "email-validator>=2.2.0",
  "httpx>=0.28.0",
  "stripe>=10.10.0",
  "redis>=5.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Shared loop for asyncpg + SQLAlchemy engine imported at module scope (avoids closed-loop errors on Windows).
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
norecursedirs = [".venv", "node_modules", "__pycache__", "pytest-cache-files-*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
